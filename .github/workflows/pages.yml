name: Test and deploy Pages
on:
  push:
    branches: [main, 3d]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out 2D from main
        uses: actions/checkout@v4
        with:
          ref: cb7e0202040e8b567b83e04b1c57b001fc6f3f61
          persist-credentials: false
      - name: Check out 3D from its independent branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/3d' && github.sha || '3d' }}
          path: .preview-3d
          persist-credentials: false
      - name: Check out the released 3D composition
        uses: actions/checkout@v4
        with:
          ref: ccf497bac3bf37219c6acfdbd43dbec9669017a7
          path: .baseline-3d
          persist-credentials: false
      - name: Record source snapshots
        run: |
          git rev-parse HEAD
          git -C .preview-3d rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && node --check app.js
      - run: |
          node --test rpg/tests/*.test.js
          find rpg -maxdepth 1 -name '*.js' -exec node --check '{}' ';'
      - run: |
          mkdir -p _site
          find rpg -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -exec cp '{}' _site/ ';'
          test -s _site/index.html
          cmp _site/index.html rpg/index.html
          test ! -e _site/rpg
          node .preview-3d/3D/scripts/preload-town.mjs _site
      - name: Test and package the isolated 3D preview
        id: package-3d
        shell: bash
        run: |
          set -euo pipefail
          cd .preview-3d/3D
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/vendor-three.mjs
          node --test tests/*.test.js
          node --check app.js
          cd ../..
          mkdir -p _site/3D/vendor
          cp .preview-3d/3D/{index.html,style.css,app.js,state.js,room-polish.js,window-landscape.js,rural-window.webp} _site/3D/
          cp .preview-3d/3D/vendor/{three.module.js,SVGRenderer.js,Projector.js,THREE-LICENSE.txt} _site/3D/vendor/
          test -s _site/3D/index.html
      - name: Compare released and candidate compositions in real Chromium
        if: github.ref == 'refs/heads/3d'
        timeout-minutes: 6
        env:
          CHROME_PATH: /usr/bin/google-chrome
          CELLO_COMPOSITION_APPEARANCE: '{"hair":7,"hairColor":2,"hat":3,"upper":0,"lower":0,"lowerColor":2,"color":0}'
        run: |
          set -euo pipefail
          mkdir -p _widebaseline
          cp -R _site/3D _widebaseline/3D
          cp .baseline-3d/3D/app.js _widebaseline/3D/app.js
          evidence="$RUNNER_TEMP/cello-composition033"
          old=0; new=0
          CELLO_COMPOSITION_LABEL=baseline032 CELLO_SMOKE_ARTIFACTS="$evidence/old" node .preview-3d/3D/tests/browser-composition.cjs _widebaseline || old=$?
          CELLO_COMPOSITION_LABEL=candidate033 CELLO_SMOKE_ARTIFACTS="$evidence/new" node .preview-3d/3D/tests/browser-composition.cjs _site || new=$?
          test "$old" = 0 && test "$new" = 0
          python .preview-3d/3D/tests/compare-composition.py "$evidence/old" "$evidence/new" > "$evidence/comparison.json"
          cat "$evidence/comparison.json"
      - name: Preserve real browser composition evidence
        if: always() && github.ref == 'refs/heads/3d'
        uses: actions/upload-artifact@v4
        with:
          name: cello-composition033
          path: ${{ runner.temp }}/cello-composition033
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
