name: Test and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the reviewed 3D preview
        uses: actions/checkout@v4
        with:
          ref: "0400c2c39da20dfffcd8e553d0842f5ea0985c68"
          path: .preview-3d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && node --check app.js
      - run: |
          node --test rpg/tests/*.test.js
          find rpg -maxdepth 1 -name '*.js' -exec node --check '{}' ';'
      - run: |
          mkdir -p _site/rpg
          find rpg -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -exec cp '{}' _site/rpg/ ';'
          cp _site/rpg/* _site/
          test -s _site/index.html
          cmp _site/index.html _site/rpg/index.html
      - name: Test and package the isolated 3D preview
        shell: bash
        run: |
          set -euo pipefail
          cd .preview-3d/3D
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/vendor-three.mjs
          node --test tests/*.test.js
          node --check app.js
          cd ../..
          mkdir -p _site/3D/vendor
          cp .preview-3d/3D/{index.html,style.css,app.js,state.js} _site/3D/
          cp .preview-3d/3D/vendor/{three.module.js,SVGRenderer.js,Projector.js,THREE-LICENSE.txt} _site/3D/vendor/
          test -s _site/3D/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
