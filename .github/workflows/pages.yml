name: Test and deploy Pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Verify experimental branch]
    branches: [experimental]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test-and-package:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      # Always resolve both current heads and verify both, not a stale triggering
      # SHA. Every publisher uses this same group; neither branch overwrites the other.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: stable
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: experimental
          path: experiment
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record and verify both source snapshots
        run: |
          git -C stable rev-parse HEAD
          git -C experiment rev-parse HEAD
          bash stable/scripts/verify-snapshot.sh stable
          bash stable/scripts/verify-snapshot.sh experiment
      - name: Package all four routes from verified snapshots
        run: node stable/scripts/package-pages.mjs stable experiment _site
      - name: Reject snapshots superseded during tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C stable rev-parse HEAD)" = "$(git -C stable ls-remote origin refs/heads/main | cut -f1)"
          test "$(git -C experiment rev-parse HEAD)" = "$(git -C experiment ls-remote origin refs/heads/experimental | cut -f1)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
