name: Test and deploy Pages
on:
  push:
    branches: [main, 3d]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out 2D from main
        uses: actions/checkout@v4
        with:
          ref: cb7e0202040e8b567b83e04b1c57b001fc6f3f61
          persist-credentials: false
      - name: Check out released 2D baseline for performance comparison
        uses: actions/checkout@v4
        with:
          ref: 7f18c86a7e9cba12713916a8a349c1605b57c0af
          path: .baseline-2d
          persist-credentials: false
      - name: Check out 3D from its independent branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/3d' && github.sha || '3d' }}
          path: .preview-3d
          persist-credentials: false
      - name: Record source snapshots
        run: |
          git rev-parse HEAD
          git -C .preview-3d rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && node --check app.js
      - run: |
          node --test rpg/tests/*.test.js
          find rpg -maxdepth 1 -name '*.js' -exec node --check '{}' ';'
      - run: |
          mkdir -p _site
          find rpg -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -exec cp '{}' _site/ ';'
          test -s _site/index.html
          cmp _site/index.html rpg/index.html
          test ! -e _site/rpg
          node .preview-3d/3D/scripts/preload-town.mjs _site
      - name: Test and package the isolated 3D preview
        id: package-3d
        shell: bash
        run: |
          set -euo pipefail
          cd .preview-3d/3D
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/vendor-three.mjs
          node --test tests/*.test.js
          node --check app.js
          cd ../..
          mkdir -p _site/3D/vendor
          cp .preview-3d/3D/{index.html,style.css,app.js,state.js,room-polish.js,window-landscape.js,rural-window.webp} _site/3D/
          cp .preview-3d/3D/vendor/{three.module.js,SVGRenderer.js,Projector.js,THREE-LICENSE.txt} _site/3D/vendor/
          test -s _site/3D/index.html
      - name: Verify teacher ambient chat in real Chromium
        if: github.ref == 'refs/heads/3d'
        timeout-minutes: 3
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: CELLO_SMOKE_ARTIFACTS="$RUNNER_TEMP/cello-release032/teacher" node .preview-3d/3D/tests/browser-idle051.cjs _site
      - name: Benchmark released and new 2D startup in paired room returns
        if: ${{ !cancelled() && github.ref == 'refs/heads/3d' && steps.package-3d.outcome == 'success' }}
        timeout-minutes: 7
        env:
          CHROME_PATH: /usr/bin/google-chrome
          CELLO_QA_MODE: transition
          CELLO_QA_ONE_CASE: '1'
          CELLO_QA_LATENCY_MS: '80'
        run: |
          set -euo pipefail
          mkdir -p _site-baseline
          find .baseline-2d/rpg -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -exec cp '{}' _site-baseline/ ';'
          node .baseline-2d/rpg/scripts/preload-town.mjs _site-baseline
          cp -R _site/3D _site-baseline/
          out="$RUNNER_TEMP/cello-release032/exit"
          for trial in 1 2 3; do
            order='baseline candidate'
            if [ "$trial" = 2 ]; then order='candidate baseline'; fi
            for build in $order; do
              site=_site
              if [ "$build" = baseline ]; then site=_site-baseline; fi
              CELLO_SMOKE_ARTIFACTS="$out/$build-$trial" node .preview-3d/3D/tests/browser-exit-ab.cjs "$site"
            done
          done
          python .preview-3d/3D/tests/compare-exit.py "$out"
      - name: Preserve 032 teacher and room handoff evidence
        if: always() && github.ref == 'refs/heads/3d'
        uses: actions/upload-artifact@v4
        with:
          name: cello-release032-browser
          path: ${{ runner.temp }}/cello-release032
          if-no-files-found: error
      - name: Verify WebGL performance and room return
        if: github.ref == 'refs/heads/3d'
        timeout-minutes: 7
        run: CELLO_SMOKE_ENTRANCE_EVIDENCE=1 CELLO_SMOKE_ARTIFACTS="$RUNNER_TEMP/cello-browser-smoke" node .preview-3d/3D/tests/browser-smoke.cjs _site
      - name: Save browser verification evidence
        if: always() && github.ref == 'refs/heads/3d'
        uses: actions/upload-artifact@v4
        with:
          name: cello-browser-smoke
          path: ${{ runner.temp }}/cello-browser-smoke
          if-no-files-found: ignore
      - name: Verify candidate cat and cold/warm door return in real Chromium
        if: ${{ !cancelled() && github.ref == 'refs/heads/3d' && steps.package-3d.outcome == 'success' }}
        timeout-minutes: 7
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          cat_status=0; door_status=0
          CELLO_SMOKE_ARTIFACTS="$RUNNER_TEMP/cello-release031/cat" node .preview-3d/3D/tests/browser-candidate.cjs _site || cat_status=$?
          CELLO_QA_MODE=transition CELLO_QA_LATENCY_MS=80 CELLO_SMOKE_ARTIFACTS="$RUNNER_TEMP/cello-release031/door" node .preview-3d/3D/tests/browser-candidate.cjs _site || door_status=$?
          test "$cat_status" = 0 && test "$door_status" = 0
      - name: Save candidate browser evidence
        if: always() && github.ref == 'refs/heads/3d'
        uses: actions/upload-artifact@v4
        with:
          name: cello-release031-browser
          path: ${{ runner.temp }}/cello-release031
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
