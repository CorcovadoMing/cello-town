<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#183f36"><title>弓弦小鎮 · 第一封邀請</title><link rel="stylesheet" href="style.css?v=3"></head><body>

<main><section class="world-wrap" aria-label="可走動的弓弦小鎮"><div class="topline"><span><i class="sun"></i> 晴朗的練琴日</span><span>晨光小徑</span></div><div class="map-stage"><section id="quest-hud" class="quest-hud" aria-labelledby="quest-title" hidden><div class="quest-heading"><div><span class="eyebrow">目前任務</span><h2 id="quest-title">D 大調的邀請</h2></div><span id="quest-count" aria-label="任務進度">0/3</span></div><ol id="steps"><li data-step="listen"><b aria-hidden="true">○</b><span>聽一次 D 大調</span></li><li data-step="rhythm"><b aria-hidden="true">○</b><span>跟節拍器練習</span></li><li data-step="memory"><b aria-hidden="true">○</b><span>不看提示拉一遍</span></li></ol><p id="quest-status" role="status">到戶外譜架開始練習。</p></section><canvas id="world" width="960" height="560" tabindex="0" aria-label="小鎮地圖。方向鍵或 WASD 移動，靠近老師或戶外譜架後按 E 互動。"></canvas><div id="toast" role="status" aria-live="polite">跟著小徑，找頭上有驚嘆號的老師。</div></div><div class="world-bottom"><span id="location">晨光小徑</span><span class="desktop-hint">WASD / 方向鍵移動 · E 互動</span></div><div class="touch-controls" aria-label="角色移動"><div class="dpad"><button data-dir="up" aria-label="往上走">⌃</button><button data-dir="left" aria-label="往左走">‹</button><span>✦</span><button data-dir="right" aria-label="往右走">›</button><button data-dir="down" aria-label="往下走">⌄</button></div><button id="interact" class="interact">交談 <span>E</span></button></div></section>
<aside><div class="eyebrow">YOUR ADVENTURE</div><h1>每一弓，<br>都算一步。</h1><p class="intro">小鎮不催你趕路。<br>帶著琴，完成今天的小小冒險。</p><p class="footnote">沒有連續打卡懲罰。進度只保存在這台裝置，不錄音、不上傳，也不自動評分。</p><p id="storage" class="footnote" role="status"></p></aside></main>
